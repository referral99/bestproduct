<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consumer Dispute – Full Flow (UP)</title>
<link rel="icon" href="../images/favicon.png">
<link rel="stylesheet" href="../assets/flow.css">
</head>
<body>
<div class="topbar" id="topbar"></div>
<h1 id="title"></h1>
<p class="subtitle" id="subtitle"></p>
<div class="controls">
  <button onclick="restart()">↺ Restart</button>
  <button onclick="goBack()" id="backBtn" style="display:none">← Undo last</button>
</div>
<div class="history-bar" id="history"></div>
<div class="flow" id="flow"></div>
<div class="acts" id="acts"></div>
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal"><button class="modal-close" onclick="closeModal()">×</button><div id="modal-content"></div></div>
</div>

<script>
window.FLOW = {
  title: "Consumer Dispute – Complete Flow (UP)",
  subtitle: "Complaint against defective goods, deficient service or unfair trade practice<br>Consumer Protection Act 2019 + Sale of Goods Act 1930 + Limitation Act 1963",
  breadcrumb: [
    {label:"Home", href:"../index.html"},
    {label:"Civil", href:"index.html"},
    {label:"Consumer Dispute"}
  ],
  acts: [
    {name:"Consumer Protection Act, 2019", href:"Consumer_Protection_Act_2019.pdf"},
    {name:"Sale of Goods Act, 1930", href:"Sale_of_Goods_Act_1930.pdf"},
    {name:"Limitation Act, 1963", href:"Limitation_Act_1963.pdf"}
  ],
  start: "start",
  steps: {
    start: {
      html: `
        <div class="box process"><h3>START</h3><p>A consumer is aggrieved by goods or services bought for consideration</p></div>
        <div class="arrow"></div>
        <div class="box decision">
          <h3>1. Are you a "consumer" and is there a valid grievance?</h3>
          <div class="choice-btns">
            <button class="btn-yes" onclick="choose('consumer')">YES – Consumer with a cause</button>
            <button class="btn-no"  onclick="choose('notconsumer')">NO – Commercial / resale purpose</button>
          </div>
        </div>`
    },
    notconsumer: {
      label: 'Not a consumer', labelClass: 'no',
      html: `
        <div class="path-label no">Goods/services for commercial resale</div>
        <div class="box danger"><h3>Outside the Act</h3><p>Purchases for resale or a commercial purpose (except self-employment livelihood) are excluded from the definition of consumer.</p></div>
        <div class="arrow"></div>
        <div class="box info"><h3>Alternative</h3><p>Pursue an ordinary civil suit for breach/damages instead.</p></div>
        <div class="arrow"></div>
        <div class="box success"><h3>END – Consumer forum not available</h3></div>`
    },
    consumer: {
      label: 'Consumer', labelClass: 'yes',
      html: `
        <div class="path-label yes">Valid consumer grievance</div>
        <div class="box decision">
          <h3>2. Nature of the grievance?</h3>
          <div class="choice-btns">
            <button class="btn-yes" onclick="choose('defect')">Defective goods</button>
            <button class="btn-alt" onclick="choose('deficiency')">Deficiency in service</button>
            <button class="btn-alt" onclick="choose('unfair')">Unfair / restrictive trade practice</button>
          </div>
        </div>`
    },
    defect: {
      label: 'Defective goods', labelClass: 'yes',
      html: `
        <div class="path-label yes">Defect in goods</div>
        <div class="box process"><h3>Grounds</h3><p>Manufacturing defect, wrong goods, quality below standard, or breach of warranty. Also covers product liability (Ch. VI of the 2019 Act).</p></div>
        <div class="arrow"></div>
        <div class="box decision">
          <h3>Proceed to choose forum?</h3>
          <div class="choice-btns"><button class="btn-yes" onclick="choose('forum')">YES</button></div>
        </div>`
    },
    deficiency: {
      label: 'Deficiency in service', labelClass: 'alt',
      html: `
        <div class="path-label alt">Deficiency in service</div>
        <div class="box process"><h3>Grounds</h3><p>Shortfall in quality/manner of service – banking, insurance, telecom, housing, medical, e-commerce etc. Includes negligence and withholding of information.</p></div>
        <div class="arrow"></div>
        <div class="box decision">
          <h3>Proceed to choose forum?</h3>
          <div class="choice-btns"><button class="btn-yes" onclick="choose('forum')">YES</button></div>
        </div>`
    },
    unfair: {
      label: 'Unfair trade practice', labelClass: 'alt',
      html: `
        <div class="path-label alt">Unfair / restrictive trade practice</div>
        <div class="box process"><h3>Grounds</h3><p>False/misleading advertisements, non-delivery, hoarding, bait selling, misleading guarantees. The CCPA can also act against misleading ads.</p></div>
        <div class="arrow"></div>
        <div class="box decision">
          <h3>Proceed to choose forum?</h3>
          <div class="choice-btns"><button class="btn-yes" onclick="choose('forum')">YES</button></div>
        </div>`
    },
    forum: {
      label: 'Choose forum (value)', labelClass: 'yes',
      html: `
        <div class="path-label yes">Pick the commission by value</div>
        <div class="box info">
          <h3>3. Pecuniary jurisdiction (2019 Act)</h3>
          <p>Based on the value of goods/services <strong>paid as consideration</strong>:</p>
          <p>• District Commission – up to ₹50 lakh<br>• State Commission – above ₹50 lakh up to ₹2 crore<br>• National Commission – above ₹2 crore</p>
          <span class="info-link" onclick="openModal('jurisdiction')">Jurisdiction & filing →</span>
        </div>
        <div class="arrow"></div>
        <div class="box info"><h3>Limitation</h3><p>Complaint must be filed within <strong>2 years</strong> of the cause of action (s.69). Delay may be condoned on sufficient cause.</p></div>
        <div class="arrow"></div>
        <div class="box decision">
          <h3>Which commission?</h3>
          <div class="choice-btns">
            <button class="btn-yes" onclick="choose('file')">District (≤ ₹50 lakh)</button>
            <button class="btn-alt" onclick="choose('file')">State (₹50L–₹2cr)</button>
            <button class="btn-alt" onclick="choose('file')">National (> ₹2cr)</button>
          </div>
        </div>`
    },
    file: {
      label: 'File complaint', labelClass: 'yes',
      html: `
        <div class="path-label yes">File the consumer complaint</div>
        <div class="box process"><h3>How to file</h3><p>File in person, by post, or online via the e-Daakhil portal. Mediation may be referred where both parties agree (s.37). No advocate is required.</p></div>
        <div class="arrow"></div>
        <div class="box docs">
          <h3>Documents to file</h3>
          <ul>
            <li>Complaint with facts, reliefs and an affidavit</li>
            <li>Invoice / bill / receipt of purchase</li>
            <li>Warranty/guarantee card and the agreement, if any</li>
            <li>Correspondence and prior complaint to the seller</li>
            <li>Expert/defect report where relevant</li>
            <li>Prescribed nominal fee (slab-based)</li>
          </ul>
        </div>
        <div class="arrow"></div>
        <div class="box decision">
          <h3>Outcome?</h3>
          <div class="choice-btns">
            <button class="btn-yes" onclick="choose('allowed')">Complaint allowed</button>
            <button class="btn-no"  onclick="choose('appeal')">Dismissed → appeal</button>
          </div>
        </div>`
    },
    allowed: {
      label: 'Complaint allowed', labelClass: 'yes',
      html: `
        <div class="path-label yes">Relief granted</div>
        <div class="box success"><h3>Reliefs (s.39)</h3><p>Replacement/removal of defect, refund of price, compensation for loss, discontinuance of unfair practice, and costs. Orders are enforceable like a decree.</p></div>
        <div class="arrow"></div>
        <div class="box success"><h3>END – Consumer compensated</h3></div>`
    },
    appeal: {
      label: 'Appeal', labelClass: 'no',
      html: `
        <div class="path-label no">Appeal the order</div>
        <div class="box info"><h3>Appeal ladder</h3><p>District → State (within 45 days) → National → Supreme Court. An appellant trader must deposit 50% of the awarded amount (capped) before appeal.</p></div>
        <div class="arrow"></div>
        <div class="box success"><h3>END – Pursue in appeal</h3></div>`
    }
  },
  modals: {
    jurisdiction: `<h2>Forum & Pecuniary Jurisdiction (2019 Act)</h2>
      <ul>
        <li>District Commission: consideration up to ₹50 lakh.</li>
        <li>State Commission: above ₹50 lakh and up to ₹2 crore.</li>
        <li>National Commission: above ₹2 crore.</li>
        <li>Complaint can be filed where the consumer resides or works, a welcome change from the old 1986 Act.</li>
        <li>Filing is possible online through the e-Daakhil portal.</li>
      </ul>`
  }
};
</script>
<script src="../assets/flow.js"></script>
</body>
</html>
