<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senior Citizen Maintenance – Full Flow (UP)</title>
<link rel="icon" href="../images/favicon.png">
<link rel="stylesheet" href="../assets/flow.css">
</head>
<body>
<div class="topbar" id="topbar"></div>
<h1 id="title"></h1>
<p class="subtitle" id="subtitle"></p>
<div class="controls">
  <button onclick="restart()">↺ Restart</button>
  <button onclick="goBack()" id="backBtn" style="display:none">← Undo last</button>
</div>
<div class="history-bar" id="history"></div>
<div class="flow" id="flow"></div>
<div class="acts" id="acts"></div>
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal"><button class="modal-close" onclick="closeModal()">×</button><div id="modal-content"></div></div>
</div>

<script>
window.FLOW = {
  title: "Senior Citizen Maintenance – Complete Flow (Uttar Pradesh)",
  subtitle: "Maintenance Tribunal • Summary & time-bound • s.23 transfer clawback<br>Maintenance and Welfare of Parents and Senior Citizens Act 2007 + HAMA 1956",
  breadcrumb: [
    {label:"Home", href:"../index.html"},
    {label:"Family", href:"index.html"},
    {label:"Senior Citizen Maintenance"}
  ],
  acts: [
    {name:"Maintenance & Welfare of Parents and Senior Citizens Act, 2007", href:"Maintenance_and_Welfare_of_Parents_and_Senior_Citizens_Act_2007.pdf"},
    {name:"Hindu Adoptions & Maintenance Act, 1956", href:"Hindu_Adoptions_and_Maintenance_Act_1956.pdf"}
  ],
  related: [
    {label:"Maintenance of Wife / Child / Parent", href:"maintenance.html"}
  ],
  start: "start",
  steps: {
    start: {
      html: `
        <div class="box process"><h3>START</h3><p>A senior citizen (60+) or a parent is unable to maintain themselves from their own income</p></div>
        <div class="arrow"></div>
        <div class="box info">
          <h3>Why this Act?</h3>
          <p>The 2007 Act gives parents and senior citizens a fast, cheap, summary remedy before a Maintenance Tribunal — simpler than a civil suit or BNSS s.144.</p>
          <span class="info-link" onclick="openModal('scope')">Who can claim & from whom →</span>
        </div>
        <div class="arrow"></div>
        <div class="box decision">
          <h3>1. Does the claimant qualify?</h3>
          <div class="choice-btns">
            <button class="btn-yes" onclick="choose('qualified')">YES – parent / senior citizen unable to maintain self</button>
            <button class="btn-no"  onclick="choose('not-qualified')">NO – has sufficient means</button>
          </div>
        </div>`
    },
    'not-qualified': {
      label: 'Does not qualify', labelClass: 'no',
      html: `
        <div class="path-label no">Able to maintain self</div>
        <div class="box danger"><h3>Not eligible under the 2007 Act</h3><p>The remedy is for those unable to maintain themselves from their own earnings or property.</p></div>
        <div class="arrow"></div>
        <div class="box success"><h3>END – No claim under this Act</h3></div>`
    },
    'qualified': {
      label: 'Eligible claimant', labelClass: 'yes',
      html: `
        <div class="path-label yes">Eligible to claim</div>
        <div class="box process">
          <h3>2. Identify the liable persons</h3>
          <p>Children / grandchildren (for a parent/grandparent) or specified relatives who would inherit (for a childless senior citizen) and have sufficient means.</p>
        </div>
        <div class="arrow"></div>
        <div class="box process">
          <h3>3. Apply to the Maintenance Tribunal</h3>
          <p>A simple application to the Tribunal (SDM-level) for the area. A senior citizen may apply in person, through an authorised person/organisation, or the Tribunal may act suo motu.</p>
        </div>
        <div class="arrow"></div>
        <div class="box docs">
          <h3>Documents – Tribunal Application</h3>
          <ul>
            <li>Application to the Maintenance Tribunal</li>
            <li>Age proof (to show senior-citizen status, if relied on)</li>
            <li>Proof of relationship with the liable persons</li>
            <li>Statement of own income/assets showing inability</li>
            <li>Details of the children's/relatives' means</li>
            <li>Identity and address proof</li>
          </ul>
        </div>
        <div class="arrow"></div>
        <div class="box process">
          <h3>4. Summary & time-bound hearing</h3>
          <p>The Tribunal follows a summary procedure, may order interim maintenance, and is to decide ordinarily within 90 days (extendable once). Maintenance is subject to a statutory ceiling (up to ₹10,000 per month).</p>
          <span class="info-link" onclick="openModal('procedure')">Summary & time-bound process →</span>
        </div>
        <div class="arrow"></div>
        <div class="box decision">
          <h3>Is inability + liable persons' means established?</h3>
          <div class="choice-btns">
            <button class="btn-yes" onclick="choose('order')">YES – order maintenance</button>
            <button class="btn-no"  onclick="choose('rejected')">NO – reject</button>
          </div>
        </div>`
    },
    'rejected': {
      label: 'Application rejected', labelClass: 'no',
      html: `
        <div class="path-label no">Not established</div>
        <div class="box danger"><h3>Application rejected</h3><p>The claimant may appeal to the Appellate Tribunal (District Magistrate / Collector) within the prescribed period.</p></div>
        <div class="arrow"></div>
        <div class="box success"><h3>END – Consider appeal</h3></div>`
    },
    'order': {
      label: 'Maintenance ordered', labelClass: 'yes',
      html: `
        <div class="path-label yes">Tribunal orders maintenance</div>
        <div class="box success">
          <h3>Monthly maintenance ordered</h3>
          <p>Payable from the date of application (or as ordered), within 30 days of the order. Default attracts interest and recovery.</p>
        </div>
        <div class="arrow"></div>
        <div class="box decision">
          <h3>Had the senior citizen gifted / transferred property to the relative?</h3>
          <div class="choice-btns">
            <button class="btn-yes" onclick="choose('clawback')">YES – with a care condition</button>
            <button class="btn-no"  onclick="choose('enforce')">NO – only maintenance due</button>
          </div>
        </div>`
    },
    'clawback': {
      label: 's.23 clawback', labelClass: 'yes',
      html: `
        <div class="path-label yes">Transfer with a condition of care</div>
        <div class="box danger">
          <h3>Section 23 – void transfer</h3>
          <p>If a senior citizen transferred property on the condition of being maintained, and the transferee neglects or refuses that care, the transfer is deemed made by fraud/coercion and may be declared <strong>void</strong> at the senior citizen's option.</p>
          <span class="info-link" onclick="openModal('s23')">Section 23 explained →</span>
        </div>
        <div class="arrow"></div>
        <div class="box process">
          <h3>Tribunal can set aside the transfer</h3>
          <p>On a finding of neglect, the Tribunal declares the transfer void and can order restoration of the property to the senior citizen.</p>
        </div>
        <div class="arrow"></div>
        <div class="box docs">
          <h3>Documents – s.23 claim</h3>
          <ul>
            <li>Copy of the gift / transfer deed showing the care condition</li>
            <li>Evidence of neglect or refusal to maintain</li>
            <li>Possession and revenue details of the property</li>
          </ul>
        </div>
        <div class="arrow"></div>
        <div class="box success"><h3>END – Transfer set aside; property restored</h3></div>`
    },
    'enforce': {
      label: 'Enforcement', labelClass: 'no',
      html: `
        <div class="path-label no">Enforcing the maintenance order</div>
        <div class="box process">
          <h3>Recovery on default</h3>
          <p>Unpaid maintenance is recovered as a fine; continued default can lead to imprisonment until payment, similar to the secular remedy.</p>
        </div>
        <div class="arrow"></div>
        <div class="box info"><h3>Overlap note</h3><p>A parent may alternatively use BNSS 2023 s.144 (which replaced CrPC s.125 from 1 July 2024) or HAMA, but cannot recover twice for the same period.</p></div>
        <div class="arrow"></div>
        <div class="box success"><h3>END – Order enforced</h3></div>`
    }
  },
  modals: {
    scope: `<h2>Scope of the 2007 Act</h2>
      <ul>
        <li><strong>Senior citizen</strong>: a person aged 60 or above; <strong>parent</strong> includes a father/mother (biological, adoptive or step) whether or not a senior citizen.</li>
        <li>Claim lies against children / grandchildren; for a childless senior citizen, against a relative who possesses or would inherit their property.</li>
        <li>Maintenance covers food, clothing, residence, medical needs and treatment.</li>
      </ul>`,
    procedure: `<h2>Summary, Time-bound Procedure</h2>
      <ul>
        <li>Application to the Maintenance Tribunal (presided by an SDM-rank officer).</li>
        <li>Interim maintenance can be ordered during the enquiry.</li>
        <li>The Tribunal aims to decide within 90 days (one 30-day extension in exceptional cases).</li>
        <li>Maintenance capped at up to ₹10,000 per month; no lawyer is required to appear.</li>
        <li>Appeal lies to the Appellate Tribunal (District Magistrate / Collector).</li>
      </ul>`,
    s23: `<h2>Section 23 – Clawback of Transfers</h2>
      <ul>
        <li>Applies where property was transferred after the Act's commencement subject to the condition of providing basic amenities and care.</li>
        <li>If that condition is not honoured, the transfer is deemed vitiated by fraud/coercion/undue influence.</li>
        <li>The Tribunal may declare the transfer void and restore the property to the senior citizen.</li>
      </ul>`
  }
};
</script>
<script src="../assets/flow.js"></script>
</body>
</html>
