        <div class="arrow"></div>
        <div class="box decision">
          <h3>Sell / gift / formal Partition Deed?</h3>
          <div class="choice-btns">
            <button class="btn-yes" onclick="choose('transfer-yes')">YES</button>
            <button class="btn-no"  onclick="choose('transfer-no')">NO – Keep as is</button>
          </div>
        </div>`
    },
    'obj-no': {

      html: `

        <div class="box success">
          <h3>Mutation Approved</h3>
          <p>Names of legal heirs entered in revenue records</p>

        </div>
        <div class="arrow"></div>
        <div class="box decision">
          <h3>Sell / gift / formal Partition Deed?</h3>
          <div class="choice-btns">
            <button class="btn-yes" onclick="choose('transfer-yes')">YES</button>

          </div>
        </div>`

          <p>Sale Deed (TPA s.54) • Gift Deed (TPA s.122) • Partition Deed • Release Deed</p>

        <div class="arrow"></div>

            <li>Registration fee</li>
            <li>Identity proofs + photos of parties & witnesses</li>
            <li>Latest mutation / Khata extract; PAN (high value)</li>

        <li>Will must be signed by the testator and attested by at least two witnesses.</li>

        <li>A Will can freely dispose of self-acquired property; only the testator's share in ancestral property can be willed.</li>
