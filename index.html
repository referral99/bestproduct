<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Hindu Succession Flow – Uttar Pradesh</title>
<style>
  :root {
    --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8;
    --process:#1d4ed8; --decision:#b45309; --success:#15803d; --danger:#b91c1c;
    --info:#0e7490; --link:#38bdf8; --btn-yes:#16a34a; --btn-no:#dc2626; --btn-alt:#7c3aed;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:14px 8px 70px}
  h1{text-align:center;font-size:1.3rem;color:#f8fafc;margin-bottom:3px}
  .subtitle{text-align:center;color:var(--muted);font-size:0.82rem;margin-bottom:12px}
  .controls{max-width:700px;margin:0 auto 10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;position:sticky;top:0;z-index:50;background:var(--bg);padding:7px 0}
  .controls button{background:#334155;color:#e2e8f0;border:none;padding:7px 13px;border-radius:7px;cursor:pointer;font-size:0.8rem}
  .controls button:hover{background:#475569}
  .history-bar{max-width:700px;margin:0 auto 8px;font-size:0.72rem;color:var(--muted);text-align:center;min-height:18px}
  .history-bar span{background:#1e293b;padding:2px 6px;border-radius:4px}
  .flow{max-width:700px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
  .step-block{display:flex;flex-direction:column;align-items:center;width:100%;animation:fadeIn .25s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .box{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center;width:100%;max-width:480px;box-shadow:0 3px 9px rgba(0,0,0,.28)}
  .box.process{border-color:var(--process);background:#1e3a5f}
  .box.decision{border-color:var(--decision);background:#3f2e1e}
  .box.success{border-color:var(--success);background:#14532d}
  .box.danger{border-color:var(--danger);background:#450a0a}
  .box.info{border-color:var(--info);background:#164e63}
  .box.docs{border-color:#a855f7;background:#2e1065;text-align:left}
  .box.example{border-color:#ca8a04;background:#422006;text-align:left}
  .box h3{font-size:.95rem;margin-bottom:3px;color:#f1f5f9}
  .box p{font-size:.82rem;color:var(--muted)}
  .box.docs h3,.box.example h3{text-align:center}
  .box.docs ul,.box.example ul{margin:6px 0 0 1rem;color:#c4b5fd;font-size:.8rem}
  .box.example ul{color:#fde68a}
  .box.docs li,.box.example li{margin-bottom:2px}
  .arrow{width:2px;height:18px;background:#64748b;position:relative;margin:2px 0}
  .arrow::after{content:"";position:absolute;bottom:-4px;left:-5px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid #64748b}
  .choice-btns{display:flex;gap:8px;margin-top:9px;justify-content:center;flex-wrap:wrap}
  .choice-btns button{min-width:95px;padding:8px 11px;border:none;border-radius:7px;font-size:.84rem;font-weight:600;cursor:pointer;transition:transform .12s}
  .choice-btns button:hover{transform:translateY(-1px)}
  .choice-btns button:disabled{opacity:.38;cursor:default;transform:none}
  .btn-yes{background:var(--btn-yes);color:#fff}
  .btn-no{background:var(--btn-no);color:#fff}
  .btn-alt{background:var(--btn-alt);color:#fff}
  .chosen-label{display:inline-block;margin-top:6px;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px}
  .chosen-label.yes{background:#166534;color:#bbf7d0}
  .chosen-label.no{background:#7f1d1d;color:#fecaca}
  .chosen-label.alt{background:#5b21b6;color:#e9d5ff}
  .path-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:999px;margin-bottom:4px}
  .path-label.yes{background:#166534;color:#bbf7d0}
  .path-label.no{background:#7f1d1d;color:#fecaca}
  .path-label.alt{background:#5b21b6;color:#e9d5ff}
  .info-link{display:inline-block;margin-top:6px;font-size:.76rem;color:var(--link);border-bottom:1px dashed var(--link);cursor:pointer}
  .info-link:hover{color:#7dd3fc}
  .note{font-size:.76rem;color:#fcd34d;margin-top:5px}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;align-items:center;justify-content:center;padding:10px}
  .modal-overlay.show{display:flex}
  .modal{background:#1e293b;border:1px solid #475569;border-radius:11px;max-width:600px;width:100%;max-height:84vh;overflow-y:auto;padding:18px;position:relative}
  .modal h2{font-size:1.05rem;margin-bottom:8px;color:#f8fafc}
  .modal h3{font-size:.92rem;margin:12px 0 4px;color:#cbd5e1}
  .modal ul,.modal ol{margin-left:1.15rem;margin-bottom:7px;color:var(--muted)}
  .modal li{margin-bottom:2px;font-size:.83rem}
  .modal p{color:var(--muted);font-size:.83rem;margin-bottom:6px}
  .modal-close{position:absolute;top:8px;right:10px;background:none;border:none;color:#94a3b8;font-size:1.25rem;cursor:pointer}
  .modal-close:hover{color:#f1f5f9}
  .tag{display:inline-block;font-size:.62rem;padding:1px 5px;border-radius:3px;background:#334155;color:#94a3b8;margin-right:3px}
</style>
</head>
<body>
<h1>Complete Hindu Succession – Uttar Pradesh</h1>
<p class="subtitle">All major permutations • Documents • Share examples • UP procedure<br>Hindu Succession Act 1956 (as amended) + UP Revenue practice</p>

<div class="controls">
  <button onclick="restart()">↺ Restart</button>
  <button onclick="goBack()" id="backBtn" style="display:none">← Undo last</button>
</div>
<div class="history-bar" id="history"></div>
<div class="flow" id="flow"></div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal"><button class="modal-close" onclick="closeModal()">×</button><div id="modal-content"></div></div>
</div>

<script>
const steps = {
  /* ========== START ========== */
  start: {
    html: `
      <div class="box process"><h3>START</h3><p>A Hindu dies in Uttar Pradesh</p></div>
      <div class="arrow"></div>
      <div class="box process">
        <h3>1. Obtain Death Certificate</h3>
        <p>Urban → Municipality / Nagar Palika<br>Rural → Gram Panchayat / Registrar of Births & Deaths</p>
      </div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>2. Gender of the deceased?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('gender','male')">Male</button>
          <button class="btn-alt" onclick="choose('gender','female')">Female</button>
        </div>
      </div>`
  },

  /* ========== MALE PATH ========== */
  'gender-male': {
    label: 'Male deceased', labelClass: 'yes',
    html: `
      <div class="path-label yes">Male Hindu</div>
      <div class="box decision">
        <h3>3. Did he leave a Will?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('will','yes')">YES – Will exists</button>
          <button class="btn-no"  onclick="choose('will','no')">NO – Intestate</button>
        </div>
      </div>`
  },

  /* ========== FEMALE PATH ========== */
  'gender-female': {
    label: 'Female deceased', labelClass: 'alt',
    html: `
      <div class="path-label alt">Female Hindu</div>
      <div class="box decision">
        <h3>3. Did she leave a Will?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('fwill','yes')">YES – Will exists</button>
          <button class="btn-no"  onclick="choose('fwill','no')">NO – Intestate</button>
        </div>
      </div>`
  },

  /* ===== MALE WILL ===== */
  'will-yes': {
    label: 'Will exists (Male)', labelClass: 'yes',
    html: `
      <div class="path-label yes">Will exists</div>
      <div class="box process">
        <h3>Verify Will</h3>
        <p>Signed by testator + attested by ≥ 2 witnesses<br>Sound mind at the time of execution</p>
        <span class="info-link" onclick="openModal('will')">Will & Probate notes →</span>
      </div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Is the Will valid / unchallenged?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('valid','yes')">YES – Valid</button>
          <button class="btn-no"  onclick="choose('valid','no')">NO – Invalid / Challenged</button>
        </div>
      </div>`
  },
  'valid-yes': {
    label: 'Valid Will', labelClass: 'yes',
    html: `
      <div class="path-label yes">Valid Will</div>
      <div class="box success">
        <h3>Property passes strictly as per Will</h3>
        <p>A Hindu male can freely dispose of his self-acquired property by Will.<br>
        He can dispose of only his share in ancestral / coparcenary property.</p>
      </div>
      <div class="arrow"></div>
      <div class="box docs">
        <h3>Documents at this stage</h3>
        <ul>
          <li>Original Will</li>
          <li>Death Certificate</li>
          <li>Affidavits of attesting witnesses (if required)</li>
          <li>List of legal heirs (even when Will exists)</li>
          <li>Property details (Khata / title deeds)</li>
          <li>Probate petition (optional but recommended for large estate)</li>
        </ul>
      </div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Nature of the property?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('nature','self')">Self-acquired</button>
          <button class="btn-no"  onclick="choose('nature','ancestral')">Ancestral / HUF</button>
        </div>
      </div>`
  },
  'valid-no': {
    label: 'Will invalid → Intestate', labelClass: 'no',
    html: `
      <div class="path-label no">Will Invalid / Challenged successfully</div>
      <div class="box danger"><h3>Treat as Intestate</h3><p>Hindu Succession Act 1956 applies as if no Will existed</p></div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Nature of the property?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('nature','self')">Self-acquired</button>
          <button class="btn-no"  onclick="choose('nature','ancestral')">Ancestral / HUF</button>
        </div>
      </div>`
  },

  /* ===== MALE NO WILL ===== */
  'will-no': {
    label: 'Male Intestate', labelClass: 'no',
    html: `
      <div class="path-label no">Male died Intestate</div>
      <div class="box process">
        <h3>Hindu Succession Act 1956 applies</h3>
        <p>Order: Class-I → Class-II → Agnates → Cognates → Government</p>
        <span class="info-link" onclick="openModal('class1')">Full Class-I list →</span>
      </div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Nature of the property?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('nature','self')">Self-acquired</button>
          <button class="btn-no"  onclick="choose('nature','ancestral')">Ancestral / HUF</button>
        </div>
      </div>`
  },

  /* ===== FEMALE WILL ===== */
  'fwill-yes': {
    label: 'Will exists (Female)', labelClass: 'yes',
    html: `
      <div class="path-label yes">Female – Will exists</div>
      <div class="box process">
        <h3>Verify Will</h3>
        <p>Same formal requirements as for a male</p>
      </div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Is the Will valid?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('fvalid','yes')">YES – Valid</button>
          <button class="btn-no"  onclick="choose('fvalid','no')">NO – Invalid</button>
        </div>
      </div>`
  },
  'fvalid-yes': {
    label: 'Valid Will (Female)', labelClass: 'yes',
    html: `
      <div class="path-label yes">Valid Will – Female</div>
      <div class="box success">
        <h3>Property passes as per Will</h3>
        <p>A Hindu female can dispose of her absolute property by Will.</p>
      </div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Continue to property type for mutation?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('agri','yes')">Agricultural land (UP)</button>
          <button class="btn-no"  onclick="choose('agri','no')">House / Shop / Plot</button>
        </div>
      </div>`
  },
  'fvalid-no': {
    label: 'Female Will invalid → Intestate', labelClass: 'no',
    html: `
      <div class="path-label no">Female Will Invalid</div>
      <div class="box danger"><h3>Treat as Intestate</h3><p>Sections 15 & 16 of Hindu Succession Act apply</p></div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Source of the property? (critical for females)</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('fsource','husband')">Inherited from Husband / Father-in-law</button>
          <button class="btn-alt" onclick="choose('fsource','parents')">Inherited from Parents / Father</button>
          <button class="btn-no"  onclick="choose('fsource','self')">Self-acquired / Other</button>
        </div>
      </div>`
  },

  /* ===== FEMALE INTESTATE ===== */
  'fwill-no': {
    label: 'Female Intestate', labelClass: 'no',
    html: `
      <div class="path-label no">Female died Intestate</div>
      <div class="box process">
        <h3>Sections 15 & 16 Hindu Succession Act</h3>
        <p>Distribution depends on the <strong>source</strong> of the property</p>
        <span class="info-link" onclick="openModal('female')">Female intestate rules explained →</span>
      </div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Source of the property?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('fsource','husband')">From Husband / Father-in-law</button>
          <button class="btn-alt" onclick="choose('fsource','parents')">From Parents / Father</button>
          <button class="btn-no"  onclick="choose('fsource','self')">Self-acquired / Other sources</button>
        </div>
      </div>`
  },
  'fsource-husband': {
    label: 'Property from Husband', labelClass: 'yes',
    html: `
      <div class="path-label yes">Property inherited from Husband / Father-in-law</div>
      <div class="box process">
        <h3>Devolution order (s.15(2)(b))</h3>
        <p>1. Sons, daughters and children of pre-deceased son/daughter<br>
        2. Heirs of the husband<br>
        3. Heirs of the father<br>
        4. Heirs of the mother</p>
      </div>
      <div class="arrow"></div>
      <div class="box docs">
        <h3>Documents needed</h3>
        <ul>
          <li>Death Certificate of the female</li>
          <li>Proof that property came from husband / father-in-law (old mutation, Will, gift deed, etc.)</li>
          <li>Family tree of husband’s side</li>
          <li>Legal-heir / succession documents of the claimants</li>
          <li>NOCs from other possible claimants</li>
        </ul>
      </div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Is the property Agricultural land in UP?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('agri','yes')">YES – Agricultural</button>
          <button class="btn-no"  onclick="choose('agri','no')">NO – House / Shop / Plot</button>
        </div>
      </div>`
  },
  'fsource-parents': {
    label: 'Property from Parents', labelClass: 'alt',
    html: `
      <div class="path-label alt">Property inherited from Parents / Father</div>
      <div class="box process">
        <h3>Devolution order (s.15(2)(a))</h3>
        <p>1. Sons, daughters and children of pre-deceased son/daughter<br>
        2. Heirs of the father<br>
        3. Heirs of the mother</p>
        <p class="note">Husband and husband’s heirs do <strong>not</strong> take this property</p>
      </div>
      <div class="arrow"></div>
      <div class="box docs">
        <h3>Documents needed</h3>
        <ul>
          <li>Death Certificate</li>
          <li>Proof that property came from parents / father</li>
          <li>Family tree of father’s side</li>
          <li>Legal-heir documents of claimants</li>
          <li>NOCs</li>
        </ul>
      </div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Is the property Agricultural land in UP?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('agri','yes')">YES – Agricultural</button>
          <button class="btn-no"  onclick="choose('agri','no')">NO – House / Shop / Plot</button>
        </div>
      </div>`
  },
  'fsource-self': {
    label: 'Self-acquired (Female)', labelClass: 'no',
    html: `
      <div class="path-label no">Self-acquired or other property of Female</div>
      <div class="box process">
        <h3>General order under s.15(1)</h3>
        <p>1. Sons, daughters + children of pre-deceased son/daughter<br>
        2. Husband<br>
        3. Heirs of husband<br>
        4. Heirs of father<br>
        5. Heirs of mother</p>
      </div>
      <div class="arrow"></div>
      <div class="box docs">
        <h3>Documents needed</h3>
        <ul>
          <li>Death Certificate</li>
          <li>Family tree showing all Class-I type heirs + husband</li>
          <li>Legal-heir certificate / affidavit</li>
          <li>NOCs from all entitled persons</li>
          <li>Title documents showing it is her absolute property</li>
        </ul>
      </div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Is the property Agricultural land in UP?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('agri','yes')">YES – Agricultural</button>
          <button class="btn-no"  onclick="choose('agri','no')">NO – House / Shop / Plot</button>
        </div>
      </div>`
  },

  /* ===== NATURE – SELF ===== */
  'nature-self': {
    label: 'Self-acquired (Male)', labelClass: 'yes',
    html: `
      <div class="path-label yes">Self-acquired Property of Male</div>
      <div class="box process">
        <h3>Identify Class-I heirs</h3>
        <p>Widow, sons, daughters, mother + children of any pre-deceased son or daughter take simultaneously and equally</p>
        <span class="info-link" onclick="openModal('shares')">Share calculation examples →</span>
      </div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Are there living Class-I heirs?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('class1','yes')">YES – Class-I present</button>
          <button class="btn-no"  onclick="choose('class1','no')">NO – Go to Class-II</button>
        </div>
      </div>`
  },
  'class1-yes': {
    label: 'Class-I present', labelClass: 'yes',
    html: `
      <div class="path-label yes">Class-I heirs exist</div>
      <div class="box example">
        <h3>Common share examples</h3>
        <ul>
          <li><strong>Widow + 2 sons + 1 daughter</strong> → each gets 1/4</li>
          <li><strong>Widow + 1 son + 2 daughters of pre-deceased son</strong> → Widow 1/3, Son 1/3, two grand-daughters share the remaining 1/3 equally (1/6 each)</li>
          <li><strong>Only daughters (no son, no widow, no mother)</strong> → daughters take equally</li>
          <li><strong>Widow + mother + 1 son</strong> → each gets 1/3</li>
        </ul>
      </div>
      <div class="arrow"></div>
      <div class="box docs">
        <h3>Documents for Mutation (Class-I)</h3>
        <ul>
          <li>Death Certificate</li>
          <li>Legal-heir certificate <strong>or</strong> detailed family-tree affidavit (notarised / on stamp paper)</li>
          <li>Identity + address proofs of all Class-I applicants</li>
          <li>NOC / consent affidavit of every other Class-I heir (or their personal appearance)</li>
          <li>Copy of current Khata / Khatauni / title deed</li>
          <li>Passport-size photos</li>
          <li>Will + Probate (if any)</li>
        </ul>
        <p class="note" style="color:#fcd34d;margin-top:6px">Legal Heir Certificate is issued by Tehsildar / SDM in UP. Succession Certificate (from Civil Court) is needed mainly for debts & securities.</p>
      </div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Is the property Agricultural land in UP?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('agri','yes')">YES – Agricultural</button>
          <button class="btn-no"  onclick="choose('agri','no')">NO – House / Shop / Plot</button>
        </div>
      </div>`
  },
  'class1-no': {
    label: 'No Class-I → Class-II', labelClass: 'no',
    html: `
      <div class="path-label no">No Class-I heirs</div>
      <div class="box process">
        <h3>Class-II heirs (in order)</h3>
        <p>Father → Brother/Sister & their children → etc. (see full list)</p>
        <span class="info-link" onclick="openModal('class2')">Complete Class-II list →</span>
      </div>
      <div class="arrow"></div>
      <div class="box docs">
        <h3>Documents for Mutation (Class-II)</h3>
        <ul>
          <li>Death Certificate</li>
          <li>Detailed family tree proving absence of all Class-I heirs</li>
          <li>Legal-heir certificate naming the Class-II claimants</li>
          <li>Identity proofs + NOCs of all Class-II claimants of the same entry</li>
          <li>Existing revenue records</li>
        </ul>
      </div>
      <div class="arrow"></div>
      <div class="box decision">
        <h3>Is the property Agricultural land in UP?</h3>
        <div class="choice-btns">
          <button class="btn-yes" onclick="choose('agri','yes')">YES – Agricultural</button>
          <button class="btn-no"  onclick="choose('agri','no')">NO – House / Shop / Plot</button>
        </div>
      </div>`
  },

  /* ===== ANCESTRAL ===== */
  'nature-ancestral': {
    label: 'Ancestral / HUF', labelClass: 'no',
    html: `
      <div class="path-label no">Ancestral / Coparcenary Property</div>
      <div class="box process">
        <h3>Coparceners (after 9-9-2005)</h3>
        <p>Sons <strong>and daughters</strong> of a coparcener are coparceners by birth and take equal share.<br>
        On death of a coparcener his/her share is first ascertained by notional partition, then that share devolves by succession.</p>
        <span class="info-link" onclick="openModal('ancestral')">Ancestral & notional partition explained →</span>
      </div>
      <div class="arrow"></div>
      <div class="box docs">
        <h3>Documents for Mutation (Ancestral)</h3>
        <ul>
          <li>Death Certificate of the deceased coparcener</li>
          <li>Genealogy / family tree of all coparceners</li>

let path = ['start'];
const flowEl = document.getElementById('flow');

function render() {
  flowEl.innerHTML = '';
  path.forEach((key, idx) => {
    const data = steps[key];
    if (!data) return;
    const block = document.createElement('div');
    block.className = 'step-block';
    block.innerHTML = data.html;
    flowEl.appendChild(block);
    if (idx < path.length - 1) {
      block.querySelectorAll('.choice-btns button').forEach(b => b.disabled = true);
      const nextKey = path[idx + 1];
      const nextData = steps[nextKey];
      if (nextData && nextData.label) {
        const decBox = block.querySelector('.box.decision');
        if (decBox) {
          const lbl = document.createElement('div');
          lbl.className = 'chosen-label ' + (nextData.labelClass || 'yes');
          lbl.textContent = 'Chosen → ' + nextData.label;
          decBox.appendChild(lbl);
        }
      }
    }
  });
  const labels = path.map(k => k === 'start' ? 'Start' : (steps[k] && steps[k].label) || k);
  document.getElementById('history').innerHTML = labels.length > 1 ? '<span>' + labels.join(' → ') + '</span>' : '';
  document.getElementById('backBtn').style.display = path.length > 1 ? 'inline-block' : 'none';
  setTimeout(() => {
    const last = flowEl.lastElementChild;
    if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 40);
}

function choose(key, value) {
  let next = '';
  if (key === 'gender') next = value === 'male' ? 'gender-male' : 'gender-female';
  else if (key === 'will') next = value === 'yes' ? 'will-yes' : 'will-no';
  else if (key === 'valid') next = value === 'yes' ? 'valid-yes' : 'valid-no';
  else if (key === 'fwill') next = value === 'yes' ? 'fwill-yes' : 'fwill-no';
  else if (key === 'fvalid') next = value === 'yes' ? 'fvalid-yes' : 'fvalid-no';
  else if (key === 'fsource') {
    if (value === 'husband') next = 'fsource-husband';
    else if (value === 'parents') next = 'fsource-parents';
    else next = 'fsource-self';
  }
  else if (key === 'nature') next = value === 'self' ? 'nature-self' : 'nature-ancestral';
  else if (key === 'class1') next = value === 'yes' ? 'class1-yes' : 'class1-no';
  else if (key === 'agri') next = value === 'yes' ? 'agri-yes' : 'agri-no';
  else if (key === 'dispute') next = value === 'yes' ? 'dispute-yes' : 'dispute-no';
  else if (key === 'obj') next = value === 'yes' ? 'obj-yes' : 'obj-no';
  else if (key === 'transfer') next = value === 'yes' ? 'transfer-yes' : 'transfer-no';

  if (next) { path.push(next); render(); }
}

function goBack() { if (path.length > 1) { path.pop(); render(); } }
function restart() { path = ['start']; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function openModal(key) {
  document.getElementById('modal-content').innerHTML = modalData[key] || '<p>No details.</p>';
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

render();
</script>
